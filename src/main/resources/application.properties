spring.application.name=reservas
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${RESERVAS_DB_HOST:localhost}:${RESERVAS_DB_PORT:5434}/${RESERVAS_DB_NAME:reservas}
spring.datasource.username=${RESERVAS_DB_USER:reservas}
spring.datasource.password=${RESERVAS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Servicio de la cátedra. URL y JWT salen del entorno o del .env, nunca del repo.
# Quedan vacíos por defecto para que los tests y el CI levanten sin ellos.
catedra.api.url=${CATEDRA_API_URL:}
catedra.api.jwt=${CATEDRA_JWT:}
catedra.api.connect-timeout=${CATEDRA_CONNECT_TIMEOUT:5s}
catedra.api.read-timeout=${CATEDRA_READ_TIMEOUT:30s}

# JWT de los usuarios de la app. La clave (Base64, mínimo 64 bytes) va en el .env y la
# comparten los dos servicios. Vacía se genera una al azar: solo sirve para tests y CI.
security.jwt.secret=${JWT_SECRET:}
security.jwt.token-validity=${JWT_TOKEN_VALIDITY:1d}
security.jwt.remember-me-validity=${JWT_REMEMBER_ME_VALIDITY:30d}
# Orígenes web permitidos, separados por coma. Vacío: ninguno (la app Android no lo necesita).
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
