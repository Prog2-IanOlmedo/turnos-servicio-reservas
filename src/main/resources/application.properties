spring.application.name=reservas
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${RESERVAS_DB_HOST:localhost}:${RESERVAS_DB_PORT:5434}/${RESERVAS_DB_NAME:reservas}
spring.datasource.username=${RESERVAS_DB_USER:reservas}
spring.datasource.password=${RESERVAS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Servicio de la cátedra. URL y JWT salen del entorno o del .env, nunca del repo.
# Quedan vacíos por defecto para que los tests y el CI levanten sin ellos.
catedra.api.url=${CATEDRA_API_URL:}
catedra.api.jwt=${CATEDRA_JWT:}
catedra.api.connect-timeout=${CATEDRA_CONNECT_TIMEOUT:5s}
catedra.api.read-timeout=${CATEDRA_READ_TIMEOUT:30s}

# JWT de los usuarios de la app. La clave (Base64, mínimo 64 bytes) va en el .env y la
# comparten los dos servicios. Vacía se genera una al azar: solo sirve para tests y CI.
security.jwt.secret=${JWT_SECRET:}
security.jwt.token-validity=${JWT_TOKEN_VALIDITY:1d}
security.jwt.remember-me-validity=${JWT_REMEMBER_ME_VALIDITY:30d}
# Orígenes web permitidos, separados por coma. Vacío: ninguno (la app Android no lo necesita).
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Kafka de la cátedra (contrato, sección 15). Los nombres reales vienen en la integración
# de la cuenta técnica y van en el .env. Los valores por defecto solo sirven para tests.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:reservas-local}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
# Sin broker, que el envío falle a los 10 s y no al minuto (valor por defecto de Kafka).
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_ENABLED:true}
catedra.group-id=${CATEDRA_GROUP_ID:sin-configurar}
catedra.kafka.actions-topic=${KAFKA_ACTIONS_TOPIC:alumnos.turnos.acciones.sin-configurar}
catedra.kafka.phone-topic=${KAFKA_PHONE_TOPIC:catedra.turnos.telefono.sin-configurar}
catedra.kafka.send-timeout=${KAFKA_SEND_TIMEOUT:10s}

# Recuperación de procesos abiertos vencidos (enunciado 8, contrato 18.3 y 18.4)
reservas.recovery.enabled=${RESERVAS_RECOVERY_ENABLED:true}
reservas.recovery.initial-delay-ms=15000
reservas.recovery.interval-ms=60000

# Catálogo propio (agenda de los profesionales). Se le reenvía el token del usuario.
catalogo.api.url=${CATALOGO_API_URL:http://localhost:8081}
catalogo.api.connect-timeout=2s
catalogo.api.read-timeout=5s
