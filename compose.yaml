services:
  postgres:
    image: postgres:17
    container_name: reservas-postgres
    environment:
      POSTGRES_DB: ${RESERVAS_DB_NAME}
      POSTGRES_USER: ${RESERVAS_DB_USER}
      POSTGRES_PASSWORD: ${RESERVAS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${RESERVAS_DB_PORT}:5432"
    volumes:
      - reservas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  reservas:
    build: .
    container_name: reservas-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de compose la base se llama postgres y escucha en 5432
      RESERVAS_DB_HOST: postgres
      RESERVAS_DB_PORT: 5432
      RESERVAS_DB_NAME: ${RESERVAS_DB_NAME}
      RESERVAS_DB_USER: ${RESERVAS_DB_USER}
      RESERVAS_DB_PASSWORD: ${RESERVAS_DB_PASSWORD}
      CATEDRA_API_URL: ${CATEDRA_API_URL:-}
      CATEDRA_JWT: ${CATEDRA_JWT:-}
      # Misma clave en los dos servicios para validar los JWT de los usuarios
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${RESERVAS_APP_PORT:-8082}:8080"

volumes:
  reservas-pgdata:
